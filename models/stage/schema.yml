models:
  - name: stg_nations
    description: Table for storing info about nations
    columns:
      - name: nation_id
        data_tests:
          - unique
          - not_null
      - name: region_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_regions')
                field: region_id
              config:
                store_failures: true
  - name: stg_regions
    columns:
      - name: region_id
        data_tests:
          - unique
          - accepted_values:
              arguments:
                values: ['AFRICA', 'AMERICA', 'ASIA', 'EUROPE', 'MIDDLE EAST']
              config:
                store_failures: true
        
                
